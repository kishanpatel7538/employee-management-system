
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        {% if employee %}
                            Update Employee
                        {% else %}
                            Add New Employee
                        {% endif %}
                    </h3>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endwith %}

                    <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name *</label>

                                <input type="text"
                                       name="first_name"
                                       class="form-control"
                                       value="{{ employee.first_name if employee else '' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name *</label>

                                <input type="text"
                                       name="last_name"
                                       class="form-control"
                                       value="{{ employee.last_name if employee else '' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       value="{{ employee.email if employee else '' }}"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>

                                <input type="text"
                                       name="phone"
                                       class="form-control"
                                       value="{{ employee.phone if employee else '' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Department</label>

                                <select name="department"
                                        class="form-select">

                                    <option value="">Select Department</option>

                                    {% for dept in ['IT', 'HR', 'Finance', 'Sales', 'Marketing', 'Operations'] %}

                                        <option value="{{ dept }}"
                                            {% if employee and employee.department == dept %}
                                                selected
                                            {% endif %}>
                                            {{ dept }}
                                        </option>

                                    {% endfor %}

                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Designation</label>

                                <input type="text"
                                       name="designation"
                                       class="form-control"
                                       value="{{ employee.designation if employee else '' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Salary</label>

                                <input type="number"
                                       name="salary"
                                       class="form-control"
                                       min="0"
                                       step="0.01"
                                       value="{{ employee.salary if employee and employee.salary is not none else '' }}">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Joining Date</label>

                                <input type="date"
                                       name="joining_date"
                                       class="form-control"
                                       value="{{ employee.joining_date.isoformat() if employee and employee.joining_date else '' }}">
                            </div>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">

                            {% if employee %}
                                Update Employee
                            {% else %}
                                Save Employee
                            {% endif %}

                        </button>

                        <a href="{{ url_for('employees.list_employees') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
